services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-criticalis}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-criticalis}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      - BETTER_AUTH_URL=${PUBLIC_URL:-http://localhost}
      - ORIGIN=${PUBLIC_URL:-http://localhost}
      - SOURCES_PATH=/data/sources
    volumes:
      - sources:/data/sources

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-criticalis}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-criticalis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-criticalis}"]
      interval: 5s
      timeout: 5s
      retries: 5

  proxy:
    image: openresty/openresty:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${LISTEN_PORT:-80}:80"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./docker/openresty/nginx.conf.template:/etc/openresty/nginx.conf.template:ro
      - ./docker/openresty/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    entrypoint: /docker-entrypoint.sh

volumes:
  pgdata:
  sources:
